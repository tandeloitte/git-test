name: Clean up deleted branch in Databricks

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to clean up in Databricks"
        required: true

permissions:
  id-token: write   # needed for federation (option 1)
  contents: read

concurrency:
  group: databricks-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-latest
    environment: databricks
    timeout-minutes: 15
    steps:
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main   # pin to a release tag or commit SHA for production

      - name: Trigger Databricks cleanup job
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          CLIENT_ID: ${{ vars.DATABRICKS_TRIGGER_SP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DATABRICKS_TRIGGER_SP_SECRET }}
          BRANCH: ${{ github.event.inputs.branch || github.event.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          JOB_ID: ${{ vars.DATABRICKS_CLEANUP_JOB_ID }}
        run: |
          echo "Cleaning up branch '$BRANCH' for $REPO_URL"

          # Exchange the scoped secret for a short-lived token limited to the jobs API
          TOKEN=$(curl -sSf -X POST "$DATABRICKS_HOST/oidc/v1/token" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d "grant_type=client_credentials" \
            -d "scope=jobs" | jq -r .access_token)
          echo "::add-mask::$TOKEN"

          PARAMS=$(jq -n --argjson id "$JOB_ID" --arg b "$BRANCH" --arg r "$REPO_URL" \
            '{job_id: $id, job_parameters: {branch: $b, repo_url: $r}}')
          DATABRICKS_AUTH_TYPE=pat DATABRICKS_TOKEN="$TOKEN" \
            databricks jobs run-now --json "$PARAMS"
